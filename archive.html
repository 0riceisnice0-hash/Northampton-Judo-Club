<body class="archive-body">
  <header class="archive-header">
    <a class="brand" href="index.html"><img src="assets/images/logo.png" alt=""><span><strong>Northampton</strong><small>Judo Club · Est. 1982</small></span></a>
    <a href="index.html">← Back to the main site</a>
  </header>
  <main>
    <section class="archive-hero">
      <div class="wrap">
        <p class="eyebrow light">Complete source content</p>
        <h1>Club archive.</h1>
        <p>This searchable library preserves the written content from every public page in the former club website, including programmes, policies, history, galleries and event records.</p>
        <div class="archive-tabs" role="tablist" aria-label="Archive view">
          <button class="active" type="button" role="tab" aria-selected="true" data-archive-view="content">Written content</button>
          <button type="button" role="tab" aria-selected="false" data-archive-view="media">Media library</button>
        </div>
        <div class="archive-controls">
          <input type="search" placeholder="Search all club content…" aria-label="Search archive" data-archive-search oninput="window.renderArchive?.()">
          <select aria-label="Filter by content type" data-archive-filter>
            <option value="all">All content</option>
            <option value="club">Club pages</option>
            <option value="events">Events</option>
            <option value="gallery">Gallery</option>
          </select>
        </div>
      </div>
    </section>
    <section class="archive-main">
      <div class="wrap">
        <p class="archive-meta" data-archive-meta>Loading archive…</p>
        <div class="archive-list" data-archive-list></div>
        <button class="archive-more" type="button" data-archive-more hidden>Load more media</button>
      </div>
    </section>
  </main>
  <script src="archive.js?v=20260913-2"></script>
